name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  spm:
    name: SwiftPM build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: >
          xcodebuild build
          -scheme IOSExtensions
          -destination 'generic/platform=iOS Simulator'
